<!DOCTYPE html>
<html>
<head>
    <title>Product Search Application</title>
</head>
<body>

    <h1>Product Search</h1>

    <form id="searchForm">

        <input
            type="text"
            id="searchInput"
            placeholder="Enter product name"
        >

        <button type="submit">
            Search
        </button>

    </form>

    <p id="loading"></p>

    <p id="error"></p>

    <div id="results"></div>

    <script src="script.js"></script>

</body>
</html>
